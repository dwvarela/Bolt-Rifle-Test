name: Build mod

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: bolt-rifle-neoforge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build
        run: gradle build

      - name: Save the jar
        uses: actions/upload-artifact@v4
        with:
          name: boltrifle-jar
          path: bolt-rifle-neoforge/build/libs/*.jar
