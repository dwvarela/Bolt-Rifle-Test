name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: bolt-rifle-neoforge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build
        run: |
          set +e
          gradle build --console=plain > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            ERR=$(grep -n -E "error:|What went wrong|Could not|Caused by|Execution failed|FAILURE" -A4 build.log | head -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle error::$ERR"
            TAIL=$(tail -25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Gradle tail::$TAIL"
          fi
          exit $STATUS

      - name: Save the jar
        uses: actions/upload-artifact@v4
        with:
          name: boltrifle-jar
          path: bolt-rifle-neoforge/build/libs/*.jar

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest
          if [ "${GITHUB_REF_NAME}" != "v2-animated-rifle" ]; then TAG=preview; fi
          gh release delete $TAG --yes --cleanup-tag || true
          gh release create $TAG build/libs/boltrifle.jar --target "${{ github.sha }}" \
            --title "$TAG build" --notes "Newest build of branch ${GITHUB_REF_NAME}. Needs GeckoLib 4.9.3 (NeoForge 1.21.1)."
